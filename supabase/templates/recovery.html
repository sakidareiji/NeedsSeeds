<h2>パスワードの再設定</h2>

<p>
  Needs Seeds のパスワード再設定のリクエストを受け付けました。以下のリンクを開いて、新しいパスワードを設定してください。
</p>

<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
    >新しいパスワードを設定する</a
  >
</p>

<p>このリンクの有効期限は1時間です。</p>

<p>
  心当たりがない場合は、このメールを破棄してください。パスワードは変更されません。
</p>
