name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチへ続けて push したら古い実行は打ち切る(無料枠の節約)。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: テスト
        # Supabase を立てていないので、DB を要する統合テストは自動スキップされる
        # (src/lib/__tests__/critical-path.integration.test.ts)。
        run: npm test

      - name: 本番ビルド
        # 実際の接続はリクエスト時なので、ビルドはダミー値で通る。
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build
